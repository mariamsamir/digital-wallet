services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: digitalwallet
      MYSQL_USER: mariam
      MYSQL_PASSWORD: mariam@123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mysql
  digital-wallet:
    image: digital-wallet:latest
    container_name: digital-wallet
    ports:
      - "8080:8080"
    networks:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: mariam
      MYSQL_PASSWORD: mariam@123
    depends_on:
      - mysql
volumes:
  mysql_data:
networks:
  mysql:
    driver: bridge